name: Build Release APK — Kōwhai

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/kowhai-release.jks"

      - name: Create key.properties
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "${{ secrets.STORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kowhai-release.jks
        # run_number gives a monotonically increasing Android buildNumber so
        # sideload updates always install over previous releases.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Checksum APK
        id: checksum
        run: |
          SHA="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d' ' -f1)"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  app-release.apk" > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kōwhai ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
